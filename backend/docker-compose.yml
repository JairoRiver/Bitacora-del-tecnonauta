services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-bitacora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bitacora}
      POSTGRES_DB: ${DB_NAME:-bitacora_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bitacora}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: